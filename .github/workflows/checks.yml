name: Validate PixelHub pull requests

on:
  pull_request:
    branches: [main, feat/physical-pallet-jack]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python PixelHub_Codex_Pack/validate_config.py
      - run: python -m pip install -r scripts/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance on production build
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CHROMIUM_PATH:-}" ]; then
            CHROMIUM_PATH="$(python - <<'PYTHON'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PYTHON
          )"
          fi
          export CHROMIUM_PATH
          npm run preview -- --port 5173 --strictPort > /tmp/pixelhub-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5173/', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Preview did not become ready')
          PY
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          retention-days: 7
